; PulsoVision · Totem de Lotação
; Disciplina 01: AI Computer Systems & Sensors (AICSS) · Global Solution 2026.2 — FIAP
;
; Arquivo: 01-aicss-totem/platformio.ini
; Resumo:  Configuração do PlatformIO: compila o firmware do totem para o ESP32 DevKit
;          (framework Arduino) e instala a biblioteca ArduinoJson.
;
; Integrantes:
;   - Tiago Thomaz Cesaro
;   - Bruno Henrique Ferreira Ambrosio
;   - Lucas Maximo dos Santos

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson @ ^7.4.1
